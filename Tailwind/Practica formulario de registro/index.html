<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090B] flex items-center justify-center min-h-screen">

    <div class="bg-[#18181B]  max-w-md p-8 rounded-xl border-2 border-gray-700 ">
        <h1 class="text-white text-3xl font-bold  mb-6">
            Sign Up
        </h1>

        <form class="space-y-4">
            <div class="flex flex-col">
                <label class="text-sm text-white mb-1 font-bold">Name</label>
                <input
                    type="text"
                    name="name"
                    class="bg-[#09090B] text-white border-2 border-gray-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
                    placeholder="Enter your name"
                >
            </div>

            <div class="flex flex-col">
                <label class="text-sm text-white mb-1 font-bold">Email</label>
                <input
                    type="email"
                    name="email"
                    class="bg-[#09090B] text-white border-2 border-gray-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
                    placeholder="Enter your email"
                >
            </div>

            <div class="flex flex-col">
                <label class="text-sm text-white mb-1 font-bold">Password</label>
                <input
                    type="password"
                    name="password"
                    class="bg-[#09090B] text-white border-2 border-gray-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600"
                    placeholder="Enter your password"
                >
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" class="accent-indigo-500" >
                <label class="text-sm text-white font-bold">
                    I agree with terms and conditions
                </label>
            </div>

            <button
                type="submit"
                class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md transition"
            >
                Sign Up
            </button>
        </form>
    </div>

</body>
</html>
